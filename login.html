
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Pranto AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #e5e7eb;
      background: #080d19;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #111a2c;
      border: 1px solid #293750;
      border-radius: 20px;
    }

    .brand {
      color: #93c5fd;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 { margin-bottom: 8px; }
    .subtitle { color: #94a3b8; line-height: 1.6; }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 24px 0;
      padding: 5px;
      background: #0b1220;
      border-radius: 10px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      color: #cbd5e1;
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .tabs button.active {
      color: white;
      background: #2563eb;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      color: white;
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 9px;
      font-size: 16px;
    }

    .submit {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      color: white;
      background: #2563eb;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled { opacity: .6; }

    #status {
      min-height: 24px;
      margin-top: 16px;
      color: #93c5fd;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      margin-top: 18px;
      color: #93c5fd;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <div class="brand">✦ PRANTO AI</div>
    <h1 id="heading">Welcome back</h1>
    <p class="subtitle" id="description">
      Log in to continue your learning journey.
    </p>

    <div class="tabs">
      <button type="button" id="login-tab" class="active">Login</button>
      <button type="button" id="signup-tab">Sign Up</button>
    </div>

    <form id="auth-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
        placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password"
        placeholder="At least 6 characters" minlength="6" required>

      <button class="submit" id="submit-button" type="submit">
        Login
      </button>
    </form>

    <p id="status" aria-live="polite"></p>

    <a class="back" href="./index.html">← Back to Student Hub</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://jtzeeeowgpjvhghcofhv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable__l1ySRrfuSG4V5AldrHQiQ_hD32xThY";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let mode = "login";

    const form = document.getElementById("auth-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submit-button");
    const loginTab = document.getElementById("login-tab");
    const signupTab = document.getElementById("signup-tab");

    function setMode(newMode) {
      mode = newMode;
      const signup = mode === "signup";

      document.getElementById("heading").textContent =
        signup ? "Create your account" : "Welcome back";

      document.getElementById("description").textContent =
        signup
          ? "Create an account to get started with Pranto AI."
          : "Log in to continue your learning journey.";

      submitButton.textContent = signup ? "Create Account" : "Login";
      passwordInput.autocomplete =
        signup ? "new-password" : "current-password";

      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);
      status.textContent = "";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submitButton.disabled = true;
      status.textContent = "Please wait...";

      try {
        if (mode === "signup") {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin + "/index.html"
            }
          });

          if (error) throw error;

          status.textContent = data.session
            ? "Account created! Opening Student Hub..."
            : "Account created. Check your email if confirmation is required, then log in.";

          if (data.session) {
            window.location.href = "./index.html";
          }
        } else {
          const { error } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) throw error;

          status.textContent = "Login successful! Opening Student Hub...";
          window.location.href = "./index.html";
        }
      } catch (error) {
        status.textContent = error.message || "Something went wrong.";
      } finally {
        submitButton.disabled = false;
      }
    });

    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        status.textContent = "You are already logged in.";
      }
    });
  </script>
</body>
</html>
